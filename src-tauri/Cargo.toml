[package]
name = "conduit"
version = "0.1.0"
description = "let ai agents use your computer"
edition = "2024"
rust-version = "1.85"

[lib]
name = "conduit_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `macos-private-api` must stay in lockstep with `app.macOSPrivateApi` in
# tauri.conf.json — it's what makes the transparent windows actually transparent
# instead of solid black.
tauri = { version = "2.11", features = ["tray-icon", "image-png", "macos-private-api"] }
tauri-plugin-store = "2.4"
# Launch at login. Handles the Run key on Windows and a LaunchAgent on macOS,
# so conduit does not have to know about either.
tauri-plugin-autostart = "2"
tauri-plugin-opener = "2"

# MCP
rmcp = { version = "3.1", features = [
  "server",
  "macros",
  "transport-streamable-http-server",
] }
schemars = "1"
axum = "0.8"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time", "net", "process"] }
tokio-util = "0.7"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
thiserror = "2"
parking_lot = "0.12"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# agent config writers
toml_edit = "0.25"
serde_yaml_ng = "0.10"
jsonc-parser = { version = "0.33", features = ["serde"] }
dirs = "6"

# imaging
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.23"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls", "charset"] }
scraper = "0.22"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = [
  "NSApplication",
  "NSWindow",
  "NSScreen",
  "NSResponder",
  "NSRunningApplication",
  "NSWorkspace",
  "NSPasteboard",
  "NSPasteboardItem",
  "NSImage",
  "NSImageRep",
  "NSBitmapImageRep",
  "NSGraphics",
] }
objc2-foundation = { version = "0.3", features = ["NSString", "NSArray", "NSGeometry", "NSDictionary", "NSValue", "NSURL"] }
# objc2-core-graphics covers every CG symbol conduit needs (events, displays,
# cursor, TCC preflight), so the older `core-graphics` crate is deliberately not
# pulled in — two sets of bindings for the same framework invites type mismatches.
objc2-core-graphics = { version = "0.3", features = [
  "libc",
  "CGEvent",
  "CGEventTypes",
  "CGEventSource",
  "CGRemoteOperation",
  "CGDirectDisplay",
  "CGWindow",
  "CGWindowLevel",
  "CGError",
] }
objc2-core-foundation = { version = "0.3", features = ["CFCGTypes", "CFString", "CFDictionary", "CFArray", "CFNumber", "CFBase"] }
accessibility-sys = "0.2"
# `macos_14_0` is what gates SCScreenshotManager — the single-frame capture path.
screencapturekit = { version = "8", features = ["macos_14_0"] }

[target.'cfg(target_os = "windows")'.dependencies]
# Pinned to the 0.61 already in the tree via tao/wry/tauri/webview2-com. Two
# copies of the largest crate in the dependency graph would double build times
# *and* make `window.hwnd()`'s HWND a different type from the one these APIs
# want, which reads as a baffling type error.
windows = { version = "0.61", features = [
  # WinRT — capture
  "Foundation",
  "Foundation_Metadata",                  # ApiInformation, for the border check
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",

  # Win32 — capture plumbing
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",  # IGraphicsCaptureItemInterop

  # geometry, windows, input, hooks
  "Win32_Graphics_Dwm",                   # DWMWA_CLOAKED, EXTENDED_FRAME_BOUNDS
  "Win32_Graphics_Gdi",                   # EnumDisplayMonitors, GetDIBits
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",      # SendInput, AttachThreadInput
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Accessibility",               # IUIAutomation

  # shell, registry, process, crypto, clipboard
  "Win32_Security",                       # OpenProcessToken, TOKEN_ELEVATION
  "Win32_Security_Cryptography",          # BCryptGenRandom
  "Win32_Storage_FileSystem",             # version resources, for app names
  "Win32_System_Com",
  "Win32_System_DataExchange",            # clipboard
  "Win32_System_Environment",             # ExpandEnvironmentStringsW (App Paths)
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",                  # GlobalAlloc/Lock, for the clipboard
  "Win32_System_Registry",                # App Paths
  "Win32_System_Threading",
  "Win32_UI_Shell",                       # ShellExecuteW, SHGetFileInfoW
] }

# Toasts. tauri-plugin-notification wraps this same crate but needs an
# AppHandle, which would change `notify`'s signature on both platforms for no
# macOS benefit.
tauri-winrt-notification = "0.7"

# macOS gets single-instance behaviour free: Launch Services activates the
# running .app instead of starting a second copy. Windows has no such rule, so
# without this, launching conduit twice leaves a second process that cannot bind
# port 6767 and shows a broken window with no explanation — and because closing
# hides to the tray, they accumulate.
tauri-plugin-single-instance = "2"

[target.'cfg(target_os = "linux")'.dependencies]
# D-Bus. Everything Wayland withholds from a plain client — input injection,
# screen capture, window geometry, the accessibility tree — is reached over the
# bus instead, so this is the single most load-bearing dependency in the port.
#
# The *blocking* API deliberately, and default features (async-io) rather than
# `tokio`: `platform::*` is a synchronous contract on all three platforms, and
# zbus's tokio integration panics if you block on it from inside a tokio worker,
# which is exactly where every tool call runs.
zbus = "5"

# Screen capture. The portal hands over a PipeWire remote; frames arrive on
# their own thread and the newest one is what `capture` crops. See
# `linux/capture.rs` for why a live stream beats a per-call screenshot here.
pipewire = "0.10"

# Reading the pointer for the panic stop. Wayland has no passive key listener
# by design, so the hold-Escape watcher reads evdev directly — see
# `linux/panic_stop.rs`, which explains why a global shortcut is not an option.
evdev = "0.13"

# Clipboard, over wlr-data-control. Needs no focused surface, which a clipboard
# tool driven by an agent never has.
wl-clipboard-rs = "0.9"

# Display geometry, and the GtkWindow handle the layer-shell calls in
# `chrome.rs` need. Pinned to the version tao already resolves, so
# `window.gtk_window()` hands back a type from *this* crate rather than a
# structurally identical one the compiler refuses to unify.
gtk = "0.18"

# Agent logos, resolved out of the active icon theme rather than bundled — the
# same rule the macOS and Windows backends follow.
freedesktop-icons = "0.4"
# Breeze ships SVG, so an icon theme lookup that cannot rasterize returns
# nothing on the user's own desktop.
resvg = "0.48"

# Synthetic input on wlroots compositors — see `platform/linux/wlroots.rs`.
#
# The portal's RemoteDesktop interface is the only *standard* input route on
# Wayland, and a large part of the desktop does not implement it: Hyprland, sway
# and every other wlroots compositor ship no backend for it, so on those
# machines the portal answers `UnknownMethod` and conduit cannot move a pointer
# at all. These two protocols are what those compositors offer instead, and they
# need no consent dialog because the compositor grants them per client.
wayland-client = "0.31"
# `zwlr_virtual_pointer_manager_v1`.
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
# `zwp_virtual_keyboard_manager_v1`. A separate crate only because it is a
# staging protocol rather than a wlr one; the compositors are the same.
wayland-protocols-misc = { version = "0.3", features = ["client"] }
# Resolve named shortcuts against the compositor's keymap, before our virtual
# keyboard installs its text map. This preserves physical compositor bindings.
xkbcommon = { version = "0.9", default-features = false }

libc = "0.2"

# Same reason as on Windows: linux has no Launch Services rule that activates
# the running copy, so a second launch would leave a process that cannot bind
# port 6767 — and because closing hides to the tray, they accumulate.
tauri-plugin-single-instance = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
