name: build

# Every push and PR gets a real build on all three platforms — conduit is one
# codebase with three backends, and the whole point of `platform/contract.rs` is
# that a change which compiles on one must compile on the others. CI is where
# that gets caught, since most work happens on a single machine.
#
# Pushing a `v*` tag additionally cuts a release with a Windows executable,
# Linux AppImage, zipped macOS app, and optional Chromium bundles. The release
# is named after the tag and describes commits since the previous tag.
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-release:
    name: validate release metadata
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Verify synchronized versions and tag
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          package_version = json.loads(Path("package.json").read_text())["version"]
          browser_version = json.loads(Path("browser-runtime/package.json").read_text())["version"]
          tauri_version = json.loads(Path("src-tauri/tauri.conf.json").read_text())["version"]
          cargo_text = Path("src-tauri/Cargo.toml").read_text()
          cargo_version = re.search(r'^version = "([^"]+)"$', cargo_text, re.MULTILINE).group(1)
          versions = {package_version, browser_version, tauri_version, cargo_version}
          if len(versions) != 1:
              raise SystemExit(f"release versions disagree: {sorted(versions)}")

          tag = os.environ.get("RELEASE_TAG", "")
          if tag:
              accepted = {f"v{package_version}"}
              major, minor, patch = package_version.split(".", 2)
              if patch == "0":
                  accepted.add(f"v{major}.{minor}")
              if tag not in accepted:
                  raise SystemExit(f"tag {tag!r} does not match version {package_version}; expected {sorted(accepted)}")
          print(f"release metadata valid: version={package_version} tag={tag or '(not a tag build)'}")
          PY

  build:
    name: ${{ matrix.label }}
    needs: validate-release
    runs-on: ${{ matrix.os }}
    strategy:
      # One platform failing should not hide the other's result.
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: windows
            # Not set for Windows: the default host target is what we ship.
            args: ""
          - os: macos-latest
            label: macos
            # One .app that runs on both Apple Silicon and Intel, rather than
            # asking people which Mac they have.
            args: "--target universal-apple-darwin"
          - os: ubuntu-22.04
            label: linux
            # Pinned to 22.04, not `ubuntu-latest`: glibc and WebKitGTK are
            # forward-compatible but not backward, so a binary built on 24.04
            # refuses to start on anything older. Building against the oldest
            # webkit2gtk-4.1 still supported is what makes one AppImage run
            # everywhere.
            args: ""

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install the Linux build dependencies
        # Tauri needs WebKitGTK and its GTK stack to link. `libgtk-layer-shell`
        # is deliberately absent: conduit dlopens it at runtime so the binary
        # runs on machines without it, and linking it here would undo that.
        # libpipewire and clang are for the capture backend's bindgen step.
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libpipewire-0.3-dev \
            libclang-dev \
            libxdo-dev \
            meson \
            ninja-build \
            zip

      - name: Build the pinned PipeWire SDK
        # Ubuntu 22.04 is deliberately our glibc baseline, but its PipeWire
        # 0.3.48 headers predate metadata used by pipewire-rs 0.10. Build the
        # pinned 1.2 API level on the same runner. This keeps the
        # AppImage compatible with older glibc while making its PipeWire ABI
        # requirement explicit and bundlable.
        if: matrix.os == 'ubuntu-22.04'
        shell: bash
        run: |
          source_dir="${RUNNER_TEMP}/pipewire-source"
          prefix="${RUNNER_TEMP}/pipewire-sdk"
          git init "$source_dir"
          git -C "$source_dir" remote add origin https://gitlab.freedesktop.org/pipewire/pipewire.git
          git -C "$source_dir" fetch --depth 1 origin 7b4c0dd5ecb40e4d2c153699a85c51e1460361e1
          git -C "$source_dir" checkout --detach FETCH_HEAD
          test "$(git -C "$source_dir" rev-parse HEAD)" = 7b4c0dd5ecb40e4d2c153699a85c51e1460361e1
          meson setup "$source_dir/build" "$source_dir" \
            --prefix="$prefix" \
            --libdir=lib \
            -Dauto_features=disabled \
            -Dspa-plugins=enabled \
            -Dexamples=disabled \
            -Dtests=disabled \
            -Dman=disabled \
            -Dsession-managers=[] \
            -Ddbus=disabled \
            -Dsystemd=disabled \
            -Dpipewire-alsa=disabled \
            -Dpipewire-jack=disabled \
            -Dpipewire-v4l2=disabled
          meson compile -C "$source_dir/build"
          meson install -C "$source_dir/build"
          echo "PKG_CONFIG_PATH=${prefix}/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=${prefix}/lib" >> "$GITHUB_ENV"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add the macOS targets
        # The universal build needs both halves present. Done as its own step
        # rather than an input that would be an empty string on Windows.
        if: matrix.os == 'macos-latest'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          key: ${{ matrix.label }}

      - run: pnpm install --frozen-lockfile

      - name: Typecheck and build the frontend
        run: pnpm build

      - name: Test the frontend
        run: pnpm test

      - name: Test
        working-directory: src-tauri
        run: cargo test --lib

      - name: Diagnose a Windows loader failure
        if: failure() && matrix.os == 'windows-latest'
        shell: pwsh
        working-directory: src-tauri
        run: |
          $binary = Get-ChildItem target/debug/deps/conduit_lib-*.exe |
            Sort-Object LastWriteTime -Descending |
            Select-Object -First 1
          if (-not $binary) {
            throw "cargo did not leave a Windows test executable to inspect"
          }

          $started = Get-Date
          & $binary.FullName --list
          $loaderExit = $LASTEXITCODE
          Start-Sleep -Seconds 2
          Write-Host "Loader exit code: $loaderExit"

          foreach ($log in @('Application', 'System')) {
            Write-Host "--- recent $log events ---"
            Get-WinEvent -FilterHashtable @{ LogName = $log; StartTime = $started } -ErrorAction SilentlyContinue |
              Select-Object TimeCreated, Id, ProviderName, LevelDisplayName, Message |
              Format-List |
              Out-String -Width 4096 |
              Write-Host
          }

          cargo build --bin conduit
          if ($LASTEXITCODE -ne 0) {
            throw "the Windows application binary did not build"
          }
          $application = Resolve-Path target/debug/conduit.exe
          $process = Start-Process $application -PassThru
          Start-Sleep -Seconds 5
          if ($process.HasExited) {
            Write-Host "Application smoke-test exit code: $($process.ExitCode)"
          } else {
            Write-Host "Application smoke test: process started successfully"
            Stop-Process -Id $process.Id -Force
          }

          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $visualStudio = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          $dumpbin = Get-ChildItem "$visualStudio\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe -ErrorAction SilentlyContinue |
            Where-Object FullName -Like '*\bin\Hostx64\x64\dumpbin.exe' |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($dumpbin) {
            Write-Host "--- test executable dependencies and imports ---"
            & $dumpbin.FullName /DEPENDENTS $binary.FullName
            & $dumpbin.FullName /IMPORTS $binary.FullName
            Write-Host "--- application dependencies and imports ---"
            & $dumpbin.FullName /DEPENDENTS $application
            & $dumpbin.FullName /IMPORTS $application
          } else {
            Write-Host "dumpbin was not found under $visualStudio"
          }

      - name: Upload Windows loader diagnostics
        if: failure() && matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: windows-loader-diagnostics
          path: |
            src-tauri/target/debug/deps/conduit_lib-*.exe
            src-tauri/target/debug/conduit.exe
          if-no-files-found: warn

      - name: Package
        env:
          # Embedded into the app so the Browser tab downloads Chromium from
          # the same release even when the tag is shortened (v1.0 vs 1.0.0).
          CONDUIT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: pnpm run package ${{ matrix.args }}

      - uses: actions/upload-artifact@v4
        with:
          name: conduit-${{ matrix.label }}
          path: dist-release/*
          if-no-files-found: error

  browser-runtime:
    name: browser runtime / ${{ matrix.target }}
    needs: validate-release
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: windows-x64
            sidecar: browser-runtime/release/bundle/bin/conduit-browser-sidecar.exe
            chromium: browser-runtime/release/bundle/chromium/chrome-win64/chrome.exe
          - os: ubuntu-22.04
            target: linux-x64
            sidecar: browser-runtime/release/bundle/bin/conduit-browser-sidecar
            chromium: browser-runtime/release/bundle/chromium/chrome-linux64/chrome
          - os: macos-15-intel
            target: macos-x64
            sidecar: browser-runtime/release/bundle/bin/conduit-browser-sidecar
            chromium: browser-runtime/release/bundle/chromium/chrome-mac/Chromium.app/Contents/MacOS/Chromium
          - os: macos-15
            target: macos-arm64
            sidecar: browser-runtime/release/bundle/bin/conduit-browser-sidecar
            chromium: browser-runtime/release/bundle/chromium/chrome-mac/Chromium.app/Contents/MacOS/Chromium

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Install Chromium and its Linux libraries
        if: matrix.os == 'ubuntu-22.04'
        run: pnpm --dir browser-runtime exec playwright install --with-deps chromium

      - name: Install Chromium
        if: matrix.os != 'ubuntu-22.04'
        run: pnpm --dir browser-runtime exec playwright install chromium

      - name: Test the private sidecar with real Chromium
        run: pnpm --dir browser-runtime test

      - name: Build and self-test the optional browser bundle
        env:
          CONDUIT_BROWSER_TARGET: ${{ matrix.target }}
          CONDUIT_BROWSER_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
        run: pnpm --dir browser-runtime build

      - name: Smoke-test packaged headless Chromium
        env:
          CONDUIT_BROWSER_SIDECAR: ${{ github.workspace }}/${{ matrix.sidecar }}
          CONDUIT_BROWSER_CHROMIUM: ${{ github.workspace }}/${{ matrix.chromium }}
          CONDUIT_BROWSER_HEADLESS: "true"
        run: pnpm --dir browser-runtime test:integration

      - name: Smoke-test packaged visible Chromium on Linux
        if: matrix.os == 'ubuntu-22.04'
        env:
          CONDUIT_BROWSER_SIDECAR: ${{ github.workspace }}/${{ matrix.sidecar }}
          CONDUIT_BROWSER_CHROMIUM: ${{ github.workspace }}/${{ matrix.chromium }}
          CONDUIT_BROWSER_HEADLESS: "false"
        run: xvfb-run -a pnpm --dir browser-runtime test:integration

      - name: Smoke-test packaged visible Chromium
        if: matrix.os != 'ubuntu-22.04'
        env:
          CONDUIT_BROWSER_SIDECAR: ${{ github.workspace }}/${{ matrix.sidecar }}
          CONDUIT_BROWSER_CHROMIUM: ${{ github.workspace }}/${{ matrix.chromium }}
          CONDUIT_BROWSER_HEADLESS: "false"
        run: pnpm --dir browser-runtime test:integration

      - uses: actions/upload-artifact@v4
        with:
          name: conduit-browser-${{ matrix.target }}
          path: |
            browser-runtime/release/*.zip
            browser-runtime/release/*.json
          if-no-files-found: error

  release:
    name: release
    needs: [build, browser-runtime]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The changelog below walks back to the previous tag, which needs the
          # history a shallow clone would omit.
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Build the changelog
        id: changelog
        shell: bash
        run: |
          current="${GITHUB_REF_NAME}"
          previous="$(git describe --tags --abbrev=0 "${current}^" 2>/dev/null || true)"

          if [ -z "$previous" ]; then
            echo "first tag — listing every commit"
            range=""
            heading="Everything so far"
          else
            range="${previous}..${current}"
            heading="Changes since ${previous}"
          fi

          {
            echo "## ${heading}"
            echo
            git log --no-merges --pretty=format:'- %s (%h)' ${range}
            echo
            echo
            echo "### Downloads"
            echo
            echo "- **Windows** — download the \`.exe\` and run it. It needs the WebView2 runtime, which Windows 11 already has."
            echo "- **macOS** — unzip \`conduit.app.zip\`, then move \`conduit.app\` to Applications. Grant Accessibility and Screen Recording when asked."
            echo "- **Linux** — download the \`.AppImage\`, run \`chmod +x conduit-*.AppImage\`, then open it. Wayland only. Answer the screen-sharing prompt each launch; the portal refuses to make that grant permanent."
            echo
            echo "No build is code-signed, so the first launch on Windows or macOS needs a click past SmartScreen or Gatekeeper."
          } > notes.md

          cat notes.md

      - uses: softprops/action-gh-release@v2
        with:
          # The release is named after the version, per the tag.
          name: ${{ github.ref_name }}
          body_path: notes.md
          files: |
            artifacts/*
          fail_on_unmatched_files: true
