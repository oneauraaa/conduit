<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!--
    conduit app icon — sky above, waves below.
    Artwork is inset to an 824px squircle inside a 1024px canvas, which is the
    macOS Big Sur+ icon grid. Colors are the full brand ramp:
    abyss → deep → blue → sky → aqua, with foam highlights on the crests.
  -->
  <defs>
    <linearGradient id="sky" x1="0.5" y1="0" x2="0.42" y2="1">
      <stop offset="0%"    stop-color="#04122E"/>
      <stop offset="26%"   stop-color="#0A2A6B"/>
      <stop offset="58%"   stop-color="#1B6BFF"/>
      <stop offset="84%"   stop-color="#6EC8FF"/>
      <stop offset="100%"  stop-color="#9FDDFF"/>
    </linearGradient>

    <!-- Aqua bloom sitting on the horizon, where sky meets water. -->
    <radialGradient id="bloom" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#35E6D5" stop-opacity="0.85"/>
      <stop offset="45%"  stop-color="#6EC8FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#6EC8FF" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="waveBack" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#0A2A6B"/>
      <stop offset="55%"  stop-color="#1B6BFF"/>
      <stop offset="100%" stop-color="#2E7BFF"/>
    </linearGradient>

    <linearGradient id="waveMid" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#3D8FFF"/>
      <stop offset="50%"  stop-color="#6EC8FF"/>
      <stop offset="100%" stop-color="#8FD8FF"/>
    </linearGradient>

    <linearGradient id="waveFront" x1="0" y1="0" x2="1" y2="0.4">
      <stop offset="0%"   stop-color="#2BC9D8"/>
      <stop offset="52%"  stop-color="#35E6D5"/>
      <stop offset="100%" stop-color="#6FF3E2"/>
    </linearGradient>

    <!-- Glass sheen across the upper-left, the way macOS icons catch light. -->
    <linearGradient id="sheen" x1="0" y1="0" x2="0.75" y2="1">
      <stop offset="0%"   stop-color="#CFF7FF" stop-opacity="0.20"/>
      <stop offset="42%"  stop-color="#CFF7FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#CFF7FF" stop-opacity="0"/>
    </linearGradient>

    <clipPath id="squircle">
      <rect x="100" y="100" width="824" height="824" rx="185" ry="185"/>
    </clipPath>
  </defs>

  <g clip-path="url(#squircle)">
    <rect x="100" y="100" width="824" height="824" fill="url(#sky)"/>

    <!-- horizon bloom -->
    <ellipse cx="512" cy="646" rx="470" ry="240" fill="url(#bloom)"/>

    <!-- back wave -->
    <path fill="url(#waveBack)"
          d="M100,636 C210,582 322,678 442,648 C562,618 682,572 802,604 C860,619 900,633 924,624 L924,924 L100,924 Z"/>
    <path fill="none" stroke="#CFF7FF" stroke-opacity="0.30" stroke-width="8" stroke-linecap="round"
          d="M100,636 C210,582 322,678 442,648 C562,618 682,572 802,604 C860,619 900,633 924,624"/>

    <!-- mid wave -->
    <path fill="url(#waveMid)"
          d="M100,724 C200,676 302,754 432,730 C562,706 690,662 812,692 C862,704 902,715 924,708 L924,924 L100,924 Z"/>
    <path fill="none" stroke="#EAFBFF" stroke-opacity="0.42" stroke-width="8" stroke-linecap="round"
          d="M100,724 C200,676 302,754 432,730 C562,706 690,662 812,692 C862,704 902,715 924,708"/>

    <!-- front wave -->
    <path fill="url(#waveFront)"
          d="M100,806 C190,770 302,838 432,818 C562,798 700,760 822,786 C868,796 904,805 924,798 L924,924 L100,924 Z"/>
    <path fill="none" stroke="#FFFFFF" stroke-opacity="0.55" stroke-width="8" stroke-linecap="round"
          d="M100,806 C190,770 302,838 432,818 C562,798 700,760 822,786 C868,796 904,805 924,798"/>

    <rect x="100" y="100" width="824" height="824" fill="url(#sheen)"/>
  </g>

  <!-- Hairline rim so the icon holds an edge against light wallpapers. -->
  <rect x="100.75" y="100.75" width="822.5" height="822.5" rx="184.25" ry="184.25"
        fill="none" stroke="#04122E" stroke-opacity="0.28" stroke-width="1.5"/>
</svg>
